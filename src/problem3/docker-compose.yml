services:
  nginx:
    image: nginx:1.30-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks: [edge]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  api:
    build: ./api
    init: true
    environment:
      PORT: "3000"
      PGHOST: postgres
      PGDATABASE: app
      PGUSER: app
      PGPASSWORD: ${APP_DB_PASSWORD:-local-dev-only-app}
      PG_POOL_MAX: "4"
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/readyz"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [edge, backend]
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  postgres:
    image: postgres:15
    command: ["postgres", "-c", "max_connections=30"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-admin}
      POSTGRES_DB: app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-dev-only-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  edge: {}
  backend:
    internal: true

volumes:
  pgdata: {}
