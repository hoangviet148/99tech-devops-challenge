name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  YAMLLINT_IMAGE: pipelinecomponents/yamllint:0.35.27@sha256:f7f7b4f8824839e33690a880dbe20944128b0dc9c55522a0b92a29b3a905cecf
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9

jobs:
  trace:
    name: Trace check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Requirement, principle and decision IDs
        run: python3 -I tools/trace_check.py
      - name: Tests of the trace check
        run: python3 -I tools/test_trace_check.py
      - name: Not a fork
        env:
          FORK: ${{ github.event.repository.fork }}
        run: |
          if [ "$FORK" != "false" ]; then
            echo "::error::The event payload gives repository.fork as '$FORK'. This repository must not be a fork."
            exit 1
          fi

  lint:
    name: Lint scripts, YAML and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck on every tracked script
        run: |
          pattern='^#!(/usr/bin/env |/bin/)(ba)?sh( |$)'
          list="$RUNNER_TEMP/scripts.txt"
          git ls-files | while IFS= read -r file; do
            [[ "$file" != *.tftpl ]] || continue
            if [[ "$file" == *.sh ]] || { [ -f "$file" ] && head -n 1 -- "$file" | grep -Eq "$pattern"; }; then
              printf '%s\n' "$file"
            fi
          done > "$list"
          if [ ! -s "$list" ]; then
            echo "::error::No tracked shell script found"
            exit 1
          fi
          echo "shellcheck on $(wc -l < "$list") scripts"
          xargs -d '\n' docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" -s bash -x -P SCRIPTDIR < "$list"
      - name: yamllint on every tracked YAML file
        run: |
          list="$RUNNER_TEMP/yaml.txt"
          git ls-files '*.yml' '*.yaml' > "$list"
          if [ ! -s "$list" ]; then
            echo "::error::No tracked YAML file found"
            exit 1
          fi
          echo "yamllint on $(wc -l < "$list") files"
          config='{extends: default, rules: {line-length: disable, document-start: disable, truthy: {check-keys: false}, comments: {min-spaces-from-content: 1}}}'
          xargs -d '\n' docker run --rm -v "$PWD:/code:ro" -w /code "$YAMLLINT_IMAGE" yamllint --strict -d "$config" < "$list"
      - name: actionlint on the root workflow
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color=false .github/workflows/ci.yml
      - name: actionlint on the Problem 4 workflows
        working-directory: src/problem4
        run: |
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "::error::No workflow file under src/problem4/.github/workflows"
            exit 1
          fi
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color=false "${workflows[@]}"
      - name: zizmor on the root and Problem 4 workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          for root in . src/problem4; do
            echo "zizmor with $root as the repository root"
            docker run --rm -e GH_TOKEN -v "$PWD/$root:/repo:ro" -w /repo "$ZIZMOR_IMAGE" --min-severity medium --no-progress .github || status=1
          done
          exit "$status"

  problem2:
    name: Problem 2 alert tests and full-disk lab
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Alert rule tests
        run: bash src/problem2/alerts/test.sh
      - name: Full-disk lab
        run: bash src/problem2/lab/run.sh --yes --out "$RUNNER_TEMP/p2-lab.md"
      - name: Lab report in the step summary
        if: always()
        run: |
          for report in "$RUNNER_TEMP/p2-lab.md" "$RUNNER_TEMP/p2-lab.md.partial"; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  problem3:
    name: Problem 3 compose checks, alert tests and fault scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/problem3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose file with the monitoring profile
        run: docker compose --profile monitoring config --quiet
      - name: nginx configuration test
        run: docker compose run --rm --no-deps nginx nginx -t
      - name: Alert rule tests
        run: bash scripts/test-alerts.sh
      - name: Fault scenarios S1, S5, S8, S11 and S12
        env:
          SCENARIOS: S1,S5,S8,S11,S12
        run: |
          report="$RUNNER_TEMP/p3-verify.md"
          bash scripts/verify.sh --yes --only "$SCENARIOS" --out "$report"
          IFS=, read -ra ids <<< "$SCENARIOS"
          for id in "${ids[@]}"; do
            if ! grep -q "^| $id | " "$report"; then
              echo "::error::verify.sh reported no result for $id"
              exit 1
            fi
          done
      - name: Scenario report in the step summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/p3-verify.md" ]; then
            cat "$RUNNER_TEMP/p3-verify.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  problem4:
    name: Problem 4 offline suites and policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/problem4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline suites
        run: bash scripts/tests/run-all.sh
      - name: Policy tests
        run: python3 -I infra/policies/test_policies.py
