resolver 127.0.0.11 valid=5s ipv6=off;

log_format upstream_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"request_time":$request_time,"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time"}';

upstream api_upstream {
    zone api_upstream 64k;
    server api:3000 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    server_tokens off;
    access_log /var/log/nginx/access.log upstream_json;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}
